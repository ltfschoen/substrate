version: "3.8"

services:
  dev:
    container_name: node-template
    # image: paritytech/ci-linux:production
    restart: always
    build:
      context: "../../"
      dockerfile: ./docker/substrate_builder.Dockerfile
      args:
        - NODE_DIR=${NODE_DIR}
    ports:
      - "9933:9933"
      - "9944:9944"
      - "9615:9615"
      - "30333:30333"
    environment:
      - CARGO_HOME=/substrate/.cargo
    volumes:
      - ./bin/node-template/node:/substrate
      # - ignore:/substrate/target
      # - .:/var/www/node-template
      - ./frame:/frame
      - ./utils:/utils
      - ./client:/client
      - ./primitives:/primitives
      - ./bin/node-template/.cargo:/substrate/.cargo
      - ./bin/node-template/.local:/substrate/.local
