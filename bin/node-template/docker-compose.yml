services:
# first line of this file must be reserved for use by ./scripts/docker_run.sh
  dev:
    container_name: node-template
    restart: always
    build:
      context: "../../"
      dockerfile: ./docker/substrate_node_template_builder.Dockerfile
    working_dir: /node-template
    ports:
      - "9933:9933"
      - "9944:9944"
      - "9615:9615"
      - "30333:30333"
    environment:
      - CARGO_HOME=/node-template/target/.cargo
    volumes:
      - ./bin/node_template:/node-template
      - ./frame:/frame
      - ./utils:/utils
      - ./client:/client
      - ./primitives:/primitives
